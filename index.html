<!doctype html>
<html lang="ru" data-app="cropper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cropper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="themes/dark.css" id="themeLink">
<style id="themeStyle"></style>
</head>
<body>

<div class="app">

  <header class="head">
    <span class="head__title" data-i18n="appTitle">Кадрирование</span>
    <span class="head__meta" id="headSize">3000×3000</span>

    <div class="spacer"></div>

    <button type="button" class="btn btn--icon" id="prefsBtn"
            data-i18n-title="prefs" title="Настройки">⚙</button>

    <div class="head__file">
      <span class="head__dot head__dot--empty" id="fileDot"></span>
      <span class="head__name" id="fileName" data-i18n="noFile">файл не выбран</span>
    </div>

    <button type="button" class="btn" id="pick" data-i18n="load">Загрузить</button>
    <button type="button" class="btn btn--primary" id="export" data-i18n="save">Скачать</button>
  </header>

  <div class="app__body">

    <section class="stage">
      <div class="stage__area">
        <div class="canvas" id="canvas">
          <canvas class="canvas__el" id="cv" width="900" height="900"></canvas>
          <div class="canvas__grid" id="grid"></div>
          <div class="canvas__badge">
            <span class="canvas__badge-text" id="badgeSize">3000×3000</span>
            <span class="canvas__badge-text canvas__badge-text--dim" id="badgeZoom">100%</span>
          </div>
          <button type="button" class="canvas__drop" id="drop" data-i18n="dropHere">
            Перетащите изображение или нажмите, чтобы выбрать файл
          </button>
        </div>
      </div>
      <div class="stage__foot">
        <span class="stage__hint" data-i18n="stageHint">
          Колесо — масштаб · перетаскивание — сдвиг · двойной клик — вписать
        </span>
        <div class="spacer"></div>
        <button type="button" class="btn btn--pill btn--on" id="gridBtn" data-i18n="grid">Сетка</button>
      </div>
    </section>

    <aside class="panel" id="panel">
      <div class="panel__head">
        <button type="button" class="btn btn--icon" id="panelToggle"
                data-i18n-title="panelCollapse" title="Свернуть панель">›</button>
        <span class="panel__title" data-i18n="panelTitle">Кадр</span>
        <div class="spacer"></div>
        <button type="button" class="btn btn--mini btn--on" id="multi"
                data-i18n-title="multiOn" title="Открывать несколько (включено)">∞</button>
        <button type="button" class="btn btn--mini" id="all"
                data-i18n-title="collapseAll" title="Свернуть все">⌃</button>
      </div>

      <div class="panel__body" id="panelBody">

        <!-- размер холста -->
        <section class="block block--open" data-block="size">
          <button type="button" class="block__head">
            <span class="block__mark">−</span>
            <span class="block__label" data-i18n="blockSize">Размер холста</span>
            <span class="block__summary" data-summary="size">Обложка</span>
          </button>
          <div class="block__body">
            <div class="group__row">
              <input type="text" inputmode="numeric" class="field__input field" id="cw" value="3000">
              <span class="group__times">×</span>
              <input type="text" inputmode="numeric" class="field__input field" id="ch" value="3000">
              <button type="button" class="btn btn--square" id="swap"
                      data-i18n-title="swap" title="Поменять сторонами">⇄</button>
            </div>
            <div class="group">
              <div class="group__title" data-i18n="presets">Шаблоны</div>
              <div class="group__list" id="presets"></div>
            </div>
          </div>
        </section>

        <!-- изображение -->
        <section class="block block--open" data-block="frame">
          <button type="button" class="block__head">
            <span class="block__mark">−</span>
            <span class="block__label" data-i18n="blockImage">Изображение</span>
            <span class="block__summary" data-summary="frame">100%</span>
          </button>
          <div class="block__body">
            <div class="field">
              <div class="field__head">
                <span class="field__label" data-i18n="zoom">Приближение</span>
                <span class="field__value" id="zoomVal">100%</span>
              </div>
              <input type="range" class="field__range" id="zoom" min="5" max="400" step="1" value="100">
            </div>
            <div class="group__row">
              <button type="button" class="btn btn--action" id="fill" data-i18n="fill">Заполнить</button>
              <button type="button" class="btn btn--action" id="fit" data-i18n="fit">Вписать</button>
              <button type="button" class="btn btn--action" id="center" data-i18n="center">Центр</button>
            </div>
            <div class="group__sep">
              <div class="group__title" data-i18n="trimTitle">Подогнать холст</div>
              <div class="group__row">
                <button type="button" class="btn btn--action" id="trimVisible" data-i18n="trimVisible">По&nbsp;размеру</button>
                <button type="button" class="btn btn--action" id="trimFit" data-i18n="trimFit">Вписать</button>
                <button type="button" class="btn btn--action" id="trimMatch" data-i18n="trimMatch">Пропорционально</button>
              </div>
              <p class="hint" id="trimHint"></p>
            </div>
          </div>
        </section>

        <!-- сохранение -->
        <section class="block" data-block="save">
          <button type="button" class="block__head">
            <span class="block__mark">+</span>
            <span class="block__label" data-i18n="blockSave">Сохранение</span>
            <span class="block__summary" data-summary="save">JPEG</span>
          </button>
          <div class="block__body">
            <div class="group__row" id="formats"></div>
            <div class="field">
              <div class="field__head">
                <span class="field__label" data-i18n="quality">Качество</span>
                <span class="field__value" id="qualityVal">94</span>
              </div>
              <input type="range" class="field__range" id="quality" min="50" max="100" step="1" value="94">
            </div>
            <input type="text" class="field__input" id="outName" value="cover-3000x3000.jpg" spellcheck="false">
            <button type="button" class="btn btn--wide" id="export2" data-i18n="save">Скачать</button>
            <p class="hint" id="qualityHint"></p>
            <p class="hint" data-i18n="exportHint">
              Экспорт идёт из исходного файла в полном разрешении: превью уменьшено, результат — нет.
            </p>
          </div>
        </section>

      </div>
    </aside>

  </div>
</div>

<!-- настройки: язык, тема, загрузка своих файлов -->
<div class="prefs" id="prefs" hidden>
  <div class="prefs__row">
    <span class="prefs__label" data-i18n="langLabel">Язык</span>
    <select class="select prefs__select" id="langSelect"></select>
    <button type="button" class="btn btn--pill" id="langFile" data-i18n="fileBtn">Файл…</button>
    <button type="button" class="btn btn--pill" id="langTemplate" data-i18n="templateBtn">Шаблон</button>
  </div>
  <div class="prefs__row">
    <span class="prefs__label" data-i18n="themeLabel">Тема</span>
    <select class="select prefs__select" id="themeSelect"></select>
    <button type="button" class="btn btn--pill" id="themeFile" data-i18n="fileBtn">Файл…</button>
  </div>
  <p class="hint" data-i18n="prefsHint"></p>
  <div class="prefs__foot">
    <button type="button" class="btn btn--pill" id="prefsReset" data-i18n="resetBtn">Сбросить своё</button>
  </div>
</div>
